[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syscred"
version = "2.4.1"
description = "Neuro-symbolic credibility verification and fact-checking system"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Dominique S. Loyer", email = "loyer.dominique@uqam.ca"}
]
keywords = ["credibility", "fact-checking", "nlp", "knowledge-graph", "ontology", "rdf", "neural-symbolic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "rdflib>=6.0.0",
    "python-dotenv>=1.0.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "spacy>=3.7.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "gunicorn>=21.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/DominiqueLoyer/systemFactChecking"
Documentation = "https://syscred.uqam.ca"
Repository = "https://github.com/DominiqueLoyer/systemFactChecking"
Issues = "https://github.com/DominiqueLoyer/systemFactChecking/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["syscred*"]

[tool.setuptools.package-data]
syscred = ["static/**/*", "ontology/**/*"]
